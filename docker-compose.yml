services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: optistore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro   # runs 001_init.sql on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optistore"]
      interval: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgres://optistore_app:change-me@db:5432/optistore
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
volumes:
  pgdata:
