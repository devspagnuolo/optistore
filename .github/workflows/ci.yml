name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: optistore }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/api/package.json }
      - name: Install, build, unit tests
        working-directory: apps/api
        run: |
          npm install   # switch to `npm ci` once package-lock.json is committed
          npm run build
          npm test
      - name: Apply migration and RLS/ledger/audit smoke test
        run: |
          psql -h localhost -U postgres -d optistore -v ON_ERROR_STOP=1 -f db/migrations/001_init.sql
          psql -h localhost -U postgres -d optistore -v ON_ERROR_STOP=1 -f db/tests/rls_smoke.sql
